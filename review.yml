actions:
  openapiHarvested: false
  reason: >-
    No publicly downloadable OpenAPI/Swagger exists — BNY's API reference and
    specifications are gated behind Nexen single sign-on. The only public
    developer artifact is the on-chain Data On-Chain smart-contract interface,
    which has no HTTP/OpenAPI surface. Nothing was fabricated; only verified
    public pages and probe statuses were recorded.
