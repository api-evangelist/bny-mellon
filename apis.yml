- aid: bny-mellon:data-on-chain
  name: BNY Data On-Chain
  description: >-
    Public, smart-contract-only product that broadcasts BNY-attested fund
    accounting data to public blockchains for on-chain and off-chain consumers
    (first implementation is the BlackRock USD Digital Liquidity BUIDL Fund).
    Consumers read data via a Solidity interface (IBNYDataConsumerV2) using a
    proxy-upgrade pattern; there is no OpenAPI/HTTP surface. Deployed on Ethereum
    Mainnet (0x7B0eC8D1D1254358A77f107118e96885EdDCEb16) and Sepolia testnet
    (0xCC75D07cBC86f306A033af29508a1b98E2178264).
  humanURL: https://github.com/bnymellon/bny-data-on-chain
