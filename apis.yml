name: BNY Mellon
kind: company
description: >-
  BNY Mellon (legal parent The Bank of New York Mellon Corporation, rebranded to
  "BNY" in 2024) is a US money-center bank and the world's largest custodian,
  overseeing roughly $50 trillion in assets under custody and/or administration.
  Its principal banking subsidiary, The Bank of New York Mellon, is a
  nationally chartered bank (OCC-supervised) headquartered in New York City,
  operating across Securities Services, Market & Wealth Services, and Investment
  & Wealth Management with brand families including Pershing, Eagle Investment
  Systems, and BNY Markets. On open finance, BNY runs a genuine first-party
  developer program — the BNY Developer Marketplace at developer.bny.com
  (formerly marketplace.bnymellon.com) — publishing Treasury Services (payments,
  liquidity, cash management, trade finance, FX), Asset Servicing, Markets, and
  Pershing API families to corporate, fintech, and financial-institution
  clients. Registration and full API reference are gated behind Nexen single
  sign-on, and no OpenAPI/Swagger is publicly downloadable. BNY also ships a
  public, smart-contract-only "Data On-Chain" product that broadcasts fund
  accounting data to Ethereum. Consumer/business-banking account data is reached
  primarily through aggregators such as Plaid rather than a first-party
  consumer data API. No FDX participation or CFPB 1033 posture is publicly
  documented.
